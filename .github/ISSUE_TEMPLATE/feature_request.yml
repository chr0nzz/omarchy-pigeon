name: Feature request
description: Something Pigeon should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, or what is awkward
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What Pigeon should do. Include the setting, key, or IPC command if you have one in mind
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, including scripts around the IPC commands
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This can be done with curl, jq, wl-copy, and the Omarchy shell, no new dependencies
        - label: I am willing to open a pull request for this
